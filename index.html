<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ráj Pokémonů</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f4;--surface:#fff;--sunk:#e8ecea;--ink:#16201e;--muted:#5c6b67;--line:#d5dcd9;--accent:#0d6b62;
--foil:linear-gradient(115deg,#ffd6e7 0%,#d6f0ff 30%,#e6ffd6 55%,#fff1c9 80%,#ffd6e7 100%);
--shadow:0 1px 2px rgba(16,32,30,.06),0 4px 14px rgba(16,32,30,.06);
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--surface:#18201f;--sunk:#111918;--ink:#e6eeec;--muted:#93a39f;--line:#2a3634;--accent:#4cc3b5;
--foil:linear-gradient(115deg,#5b3346 0%,#2c4a5e 30%,#3b5a33 55%,#5e5030 80%,#5b3346 100%);--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.summary{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.summary>div{background:var(--surface);padding:14px 18px;min-width:0}
.big{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1.05}
.czk-big{font-family:var(--display);font-weight:700;font-size:clamp(17px,2.6vw,22px);color:var(--muted)}
.mid{font-family:var(--display);font-weight:700;font-size:22px}
.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.find{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:17px;color:inherit;border:2px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px 14px 12px 42px;min-height:50px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;min-height:50px;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.answer{margin:14px 0 10px;font-size:15px}
.answer b{font-family:var(--display)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.tile{position:relative;aspect-ratio:63/88;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);overflow:hidden}
.tile.foil::before{content:"";position:absolute;inset:0;background:var(--foil);opacity:.55;pointer-events:none}
.tile>*{position:relative}
.setline{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.name{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.setname{font-size:12.5px;color:var(--muted);line-height:1.3}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.var{color:var(--accent)}
.price{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.czk{font-size:13px;font-weight:600;color:var(--muted)}
.qty{position:absolute;top:-1px;right:-1px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;padding:3px 9px;border-radius:0 12px 0 10px}
.none{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);line-height:1.6}
.foot a{color:var(--accent)}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:10px}.name{font-size:16px}.price{font-size:19px}}
/* compact tiles */
.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{aspect-ratio:auto;padding:7px 8px 8px;gap:3px;border-radius:9px;box-shadow:none}
.setline{font-size:9.5px;letter-spacing:.02em;flex-wrap:wrap;column-gap:4px;row-gap:0}
.setline span{overflow-wrap:anywhere;min-width:0}
.qty~.setline{padding-right:22px}
.name{font-size:13.5px;line-height:1.15}
.setname{font-size:10.5px;line-height:1.25}
.chips{gap:3px}
.chip{font-size:9.5px;padding:0 5px;line-height:1.5}
.spacer{flex:1;min-height:2px}
.price{font-size:15.5px}
.czk{font-size:11px}
.qty{font-size:10.5px;padding:1px 6px;border-radius:0 9px 0 8px}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{padding:6px 6px 7px}.name{font-size:12.5px}.price{font-size:14px}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
(async function(){
const root0=document.getElementById("root");root0.innerHTML='<p style="color:var(--muted)">Načítám sbírku…</p>';
let D;try{D=await (await fetch("data.json?t="+Date.now(),{cache:"no-store"})).json()}catch(e){root0.innerHTML='<p>Sbírku se nepodařilo načíst. Zkuste stránku obnovit.</p>';return}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const eur=v=>v==null?"—":new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"EUR",maximumFractionDigits:v>=1000?0:2}).format(v);
const czk=v=>v==null||!D.fx?"":new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK",maximumFractionDigits:0}).format(Math.ceil(Math.round(v*D.fx.rate*100)/100/5)*5);
const fmtDate=s=>{const d=new Date(s);return isNaN(d)?"—":d.toLocaleDateString("cs-CZ")};
const pl=(n,a,b,c)=>n+" "+(n==1?a:n>=2&&n<=4?b:c);
const VL={r:"Reverse holo",h:"Holo",f:"1. edice"};
let q=new URLSearchParams(location.search).get("q")||"", sort="value", setF="";
const count=D.items.reduce((a,it)=>a+it.q,0);
const sets=[...new Map(D.items.map(it=>[it.sid,[it.set,it.d]])).entries()].sort((a,b)=>(b[1][1]||"").localeCompare(a[1][1]||""));
function list(){
  const w=norm(q).split(/\s+/).filter(Boolean);
  let l=D.items.filter(it=>(!setF||it.sid===setF)&&w.every(x=>it._h.includes(x)));
  const cmp={value:(a,b)=>(b.p??-1)*b.q-(a.p??-1)*a.q,name:(a,b)=>a.n.localeCompare(b.n,"cs"),set:(a,b)=>(b.d||"").localeCompare(a.d||"")||(parseInt(a.no)||0)-(parseInt(b.no)||0)}[sort];
  return l.sort(cmp);
}
D.items.forEach(it=>it._h=norm([it.n,it.set,it.code,it.sid,it.no,it.cnt?it.no+"/"+it.cnt:"",it.r,VL[it.v]].join(" ")));
function tile(it){return `<article class="tile${it.v==="r"||it.v==="h"?" foil":""}">${it.q>1?`<span class="qty">×${it.q}</span>`:""}
  <div class="setline"><span>${esc(it.code)}</span><span>${esc(it.no)}${it.cnt?"/"+it.cnt:""}</span></div>
  <div class="name">${esc(it.n)}</div><div class="setname">${esc(it.set)}</div>
  <div class="chips">${it.r?`<span class="chip">${esc(it.r)}</span>`:""}${VL[it.v]?`<span class="chip var">${VL[it.v]}</span>`:""}</div>
  <div class="spacer"></div><div><div class="price">${eur(it.p)}</div>${it.p!=null&&D.fx?`<div class="czk">≈ ${czk(it.p)}</div>`:""}</div></article>`}
function render(){
  const l=list(); const root=document.getElementById("root");
  const ae=document.activeElement, fid=ae&&ae.id, pos=ae&&ae.selectionStart;
  let ans="";
  if(q.trim()||setF) ans=l.length?`Ano, <b>${l.length===1?"tuhle kartu mám":`mám ${pl(l.length,"odpovídající kartu","odpovídající karty","odpovídajících karet")}`}</b>.`:`<b>Tuhle kartu ve sbírce nemám.</b> Zkuste jiný název nebo číslo.`;
  root.innerHTML=`<div class="eyebrow">Pokémon TCG · sbírka</div><h1>${esc(D.title)}</h1>
  <section class="summary"><div><div class="lbl">Karet</div><div class="mid">${count}</div><div class="sub">${pl(D.items.length,"druh","druhy","druhů")}</div></div>
  <div><div class="lbl">Ceny</div><div class="mid" style="font-size:17px">${fmtDate(D.pricesAt)}</div><div class="sub">Cardmarket${D.fx?`, kurz ČNB ${D.fx.rate.toLocaleString("cs-CZ",{minimumFractionDigits:3})}`:""}</div></div></section>
  <div class="find"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Hledáte kartu? Napište jméno, edici nebo číslo…" value="${esc(q)}" aria-label="Hledat kartu" autocomplete="off"></div>
  <select id="setf" aria-label="Edice"><option value="">Všechny edice</option>${sets.map(([k,v])=>`<option value="${esc(k)}"${k===setF?" selected":""}>${esc(v[0])}</option>`).join("")}</select>
  <select id="sort" aria-label="Řazení">${[["value","Podle hodnoty"],["name","Podle jména"],["set","Podle edice"]].map(([k,t])=>`<option value="${k}"${k===sort?" selected":""}>${t}</option>`).join("")}</select></div>
  <div class="answer">${ans||`${pl(D.items.length,"karta","karty","karet")} ve sbírce`}</div>
  ${l.length?`<div class="grid">${l.map(tile).join("")}</div>`:(D.items.length?`<div class="none">Nic nenalezeno.</div>`:`<div class="none">Sbírka je zatím prázdná.</div>`)}
  <p class="foot">Ceny podle <a href="https://www.cardmarket.com/en/Pokemon" rel="noopener">Cardmarket</a>: ${D.rule?esc(D.rule)+" (při méně než 5 nabídkách nejnižší z nich)":"Price Guide (medián trendu, 7denního a 30denního průměru)"}, přepočet podle kurzu ČNB zaokrouhlený nahoru na 5 Kč. Orientační hodnoty, nezohledňují stav karet. Aktualizováno ${fmtDate(D.updated)}.</p>`;
  if(fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}});
document.addEventListener("change",e=>{if(e.target.id==="sort"){sort=e.target.value;render()}if(e.target.id==="setf"){setF=e.target.value;render()}});
render();
})();
</script>
</body>
</html>
